<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For Shruti 🌸</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Intro -->
    <section id="intro">

        <h1>Hi Shruti 🌸</h1>

        <p class="line">
            This isn't another apology...
        </p>

        <p class="line2">
            Some conversations deserve more than a text.
        </p>

        <button id="showEnvelope">
            Continue ❤️
        </button>

    </section>

    <!-- Envelope -->

    <section id="envelopeSection" class="hidden">

        <div class="message">

            <h2>💌</h2>

            <p>Tap the envelope to open your letter</p>

        </div>

        <div id="envelope">

            <div class="top"></div>

            <div class="body"></div>

            <div class="letter">

                <h2>A Letter For You 🌸</h2>

            </div>

        </div>

    </section>

    <!-- Letter -->

    <section id="letterSection" class="hidden">

        <div class="paper">

            <h1>Dear Shruti,</h1>

            <p id="text"></p>

            <button id="nextBtn">
                Continue →
            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
